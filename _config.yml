title: "ldx3 — Talks & Vendors"
description: "Conference talk notes and vendors-to-explore from LDX3."
url: "https://Houms.github.io"
baseurl: "/ldx3"

collections:
  talks:
    output: true
    permalink: /talks/:name/

defaults:
  - scope:
      path: ""
      type: talks
    values:
      layout: talk

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - TODO.md
  - tasks/
  - features/
  - vendor/


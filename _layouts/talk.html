<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} — {{ site.title }}</title>
  {% if page.summary %}<meta name="description" content="{{ page.summary }}">{% endif %}
</head>
<body>
  <main>
    <p><a href="{{ '/' | relative_url }}">&larr; Back to index</a></p>
    <h1>{{ page.title }}</h1>
    <p class="metaline">{{ page.date | date: "%Y-%m-%d" }} &middot; {{ page.speaker }}</p>
    {{ content }}
  </main>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} — {{ site.title }}</title>
  {% if page.summary %}<meta name="description" content="{{ page.summary }}">{% endif %}
</head>
<body>
  <main>
    <p><a href="{{ '/' | relative_url }}">&larr; Back to index</a></p>
    <h1>{{ page.title }}</h1>
    <p class="metaline"><a href="{{ page.homepage }}">{{ page.homepage }}</a> &middot; seen at {{ page.seen_at }}</p>
    <p class="summary">{{ page.summary }}</p>
    {{ content }}
  </main>
</body>
</html>
